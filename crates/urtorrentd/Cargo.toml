[package]
name = "urtorrentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A BitTorrent daemon on urtorrent with a typed HTTP API"
publish = false

[lints]
workspace = true

[dependencies]
# The library, through its facade only (AGENTS.md rule 5).
urtorrent = { path = "../../../urtorrent/crates/urtorrent", version = "0.13.2" }
# HTTP API. tokio's runtime is fine here: it serves the API, never torrent I/O (AGENTS.md 4.2).
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# The typed schema (OpenAPI 3.1) generated from the handlers and types.
utoipa = { version = "5", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.2"
serde = { version = "1", features = ["derive"] }
# Building the server-sent event stream (`stream::unfold`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
# Adding torrents from http(s) URLs; rustls like the library (no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# Passwords (argon2) and API keys (SHA-256) are stored hashed.
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
getrandom = "0.3"
# .torrent files travel as base64 in JSON bodies.
base64 = "0.22"
# The daemon's state: one SQLite database (ADR 0004); SQLite is compiled in.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
maxminddb = { version = "0.32", default-features = false }
# statvfs for free disk space, without unsafe code.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "0.33", default-features = false }
sha1 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
