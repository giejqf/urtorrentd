name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: xtask check
    runs-on: ubuntu-24.04
    steps:
      # The library comes from crates.io (urtorrent and its urtorrent-* crates).
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          V=0.20.2
          curl -sSL -o cd.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf cd.tgz && install -m755 "cargo-deny-${V}-x86_64-unknown-linux-musl/cargo-deny" ~/.cargo/bin/
      - run: cargo xtask check

  sdk:
    name: TypeScript SDK from openapi.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm run check

  web:
    name: Web UI (checks and end-to-end tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: cargo xtask web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
