# cargo-deny policy (AGENTS.md section 7). Unlike the library, the daemon may
# depend on tokio's runtime and mio (the HTTP API is off the torrent data
# path, AGENTS.md 4.2); TLS stays pure Rust.

[graph]
exclude = ["xtask"]
all-features = false
exclude-dev = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: a compile-time proc-macro under utoipa-axum; unmaintained, no known vulnerability" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "TLS is pure Rust: rustls (AGENTS.md 4.7)" },
    { crate = "openssl-sys", reason = "TLS is pure Rust: rustls (AGENTS.md 4.7)" },
    { crate = "native-tls", reason = "TLS is pure Rust: rustls (AGENTS.md 4.7)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
